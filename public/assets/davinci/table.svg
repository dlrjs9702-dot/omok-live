<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="none">
  <!-- 다빈치 코드 게임 테이블(자체 제작): 나무 테두리 + 녹색 펠트 + 가운데 조명 -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b4226"/>
      <stop offset=".35" stop-color="#8a5a33"/>
      <stop offset=".6" stop-color="#5c3820"/>
      <stop offset="1" stop-color="#7a4b2a"/>
    </linearGradient>
    <pattern id="grain" width="140" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 6 Q35 2 70 7 T140 5" stroke="#3f2614" stroke-opacity=".35" stroke-width="2" fill="none"/>
      <path d="M0 14 Q40 10 80 15 T140 12" stroke="#a36c3f" stroke-opacity=".25" stroke-width="1.5" fill="none"/>
    </pattern>
    <radialGradient id="felt" cx=".5" cy=".48" r=".65">
      <stop offset="0" stop-color="#2f7a52"/>
      <stop offset=".55" stop-color="#1f5c3c"/>
      <stop offset="1" stop-color="#123a26"/>
    </radialGradient>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0L6 6M6 0L0 6" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff8e1" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff8e1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" rx="64" fill="url(#wood)"/>
  <rect width="1200" height="800" rx="64" fill="url(#grain)"/>
  <rect x="26" y="26" width="1148" height="748" rx="46" fill="#2b1a0e" opacity=".55"/>
  <rect x="36" y="36" width="1128" height="728" rx="40" fill="url(#felt)"/>
  <rect x="36" y="36" width="1128" height="728" rx="40" fill="url(#weave)"/>
  <ellipse cx="600" cy="390" rx="430" ry="260" fill="url(#glow)"/>
  <rect x="36" y="36" width="1128" height="728" rx="40" fill="none" stroke="#0b2417" stroke-opacity=".6" stroke-width="6"/>
  <ellipse cx="600" cy="400" rx="150" ry="95" fill="none" stroke="#e8f5e9" stroke-opacity=".08" stroke-width="3" stroke-dasharray="10 12"/>
</svg>
