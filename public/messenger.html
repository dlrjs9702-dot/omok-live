<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#fff6e3" />
  <title>아일랜드 메신저</title>
  <!-- 메신저 단독 창 (gamecenter-notes docs/messenger-standalone-20261025.md B안): its own page, no game code; a notice when
       shut (the app's sw.js since v1.10.210: the icon badge). 다음 메신저 묶음 (docs/messenger-speed-photo-20261103.md 10절):
       its own app again -- messenger.webmanifest (id /messenger, start /messenger.html), installed apart from the island's -->
  <link rel="manifest" href="/messenger.webmanifest" />
  <link rel="icon" href="/icons/messenger-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/messenger.css" />
  <script src="/messenger-theme.js"></script>
</head>
<body class="messengerPage">
  <main class="mPage">
    <header class="mTop isle-paper">
      <strong class="mTitle">아일랜드 메신저</strong>
      <span class="mTopActions">
        <label class="mThemePick">화면 <select id="mTheme" aria-label="화면 밝기"><option value="light">밝게</option><option value="dark">어둡게</option><option value="system">기기 설정 따르기</option></select></label>
        <label id="mAlertPick" class="mThemePick hidden">알림 <select id="mAlert" aria-label="알림 방식"><option value="open">열어 둘 때만</option><option value="push">닫아도 받기</option><option value="off">안 받기</option></select></label>
        <button id="mPushBtn" type="button" class="secondary tiny hidden">알림 켜기</button>
        <button id="mInstallBtn" type="button" class="secondary tiny hidden">앱으로 설치</button>
        <button id="mDevicesBtn" type="button" class="ghost tiny hidden" aria-expanded="false" aria-controls="mDevices">로그인된 기기</button>
        <button id="mLogoutBtn" type="button" class="ghost tiny hidden">로그아웃</button>
        <!-- 메신저 정리 12절: in the island app's 서랍 (?embed=1) only these two -->
        <button id="mOpenApp" type="button" class="secondary tiny mEmbedOnly">메신저 앱으로 열기 ↗</button>
        <button id="mCloseEmbed" type="button" class="ghost tiny mEmbedOnly" aria-label="메신저 닫기">✕</button>
      </span>
    </header>
    <p id="mChromeInstall" class="mInstallHint hidden" role="note"><button id="mChromeInstallBtn" type="button" class="primary tiny">주소 복사</button> <span id="mChromeInstallText">크롬 메뉴 ⋮ → 앱 설치(홈 화면에 추가)</span> <button id="mChromeInstallClose" type="button" class="ghost tiny" aria-label="안내 닫기">✕</button></p>    <p id="mInstallHint" class="mInstallHint mEmbedOnly hidden" role="note"><span id="mInstallHintText">메신저 앱을 설치하면 창을 닫아도 알림을 받아요</span> <button id="mInstallHintChrome" type="button" class="primary tiny hidden">주소 복사</button> <button id="mInstallHintClose" type="button" class="ghost tiny" aria-label="안내 닫기">✕</button></p>
    <p id="mWake" class="mWake hidden" role="status">서버를 깨우는 중이에요… 처음 한 번은 30~40초 걸릴 수 있어요.</p>
    <form id="mLogin" class="mLogin isle-paper hidden">
      <strong>로그인</strong>
      <label>아이디 <input id="mLoginId" type="text" autocomplete="username" required /></label>
      <label>비밀번호 <input id="mLoginPw" type="password" autocomplete="current-password" required /></label>
      <label class="mKeep"><input id="mKeep" type="checkbox" checked /> 이 기기에서 로그인 유지 (60일)</label>
      <button class="primary" type="submit">로그인</button>
      <p id="mLoginStatus" class="mStatus" role="status"></p>
    </form>
    <section id="mDevices" class="mDevices isle-paper hidden" aria-label="로그인된 기기">
      <strong>로그인 유지 중인 기기</strong>
      <ul id="mDeviceList"></ul>
      <button id="mDropOthers" type="button" class="ghost tiny">이 기기 말고 모두 끊기</button>
    </section>
    <div id="mApp" class="messengerBody mApp hidden">
      <section class="messengerRooms" aria-label="대화방">
        <div class="messengerRoomsHead"><button id="messengerNewBtn" type="button" class="secondary tiny">새 대화방</button><button id="messengerDmBtn" type="button" class="secondary tiny">1:1 대화</button></div>
        <ul id="messengerRoomList" class="messengerRoomList"></ul>
      </section>
      <section id="messengerRoom" class="messengerRoom" aria-label="대화">
        <div class="messengerRoomHead"><button id="messengerBackBtn" type="button" class="ghost tiny messengerBack">‹ 목록</button><strong id="messengerRoomName"></strong><button id="messengerMoreBtn" type="button" class="ghost tiny messengerMore" aria-haspopup="menu" aria-expanded="false" aria-controls="messengerMoreMenu" aria-label="방 메뉴">⋯</button><div id="messengerMoreMenu" class="messengerMoreMenu hidden" role="menu"><button id="messengerInviteBtn" type="button" role="menuitem">초대</button><button id="messengerRenameBtn" type="button" role="menuitem">이름 바꾸기</button><button id="messengerPinBtn" type="button" role="menuitem">고정</button><button id="messengerMuteBtn" type="button" role="menuitem">알림 끄기</button><button id="messengerLeaveBtn" type="button" role="menuitem" class="messengerLeave">방 나가기</button></div></div>
        <p id="messengerMembers" class="smallMuted"></p>
        <div class="messengerLog"><div id="messengerMessages" class="chatMessages messengerMessages" role="log" aria-live="polite"><p class="emptyState">대화방을 고르거나 새로 만드세요.</p></div><button id="messengerNewBelow" type="button" class="secondary tiny messengerNewBelow hidden">새 메시지 ↓</button></div>
        <div id="messengerShots" class="messengerShots hidden" aria-label="보낼 사진"></div>
        <!-- v1.10.279 이모티콘: 😊 판 (입력칸 위) -- 「이모티콘」 누르면 크게, 한 번 더 누르면 보내기 · 「그림 글자」 누르면 입력칸에 -->
        <div id="messengerEmoji" class="messengerEmoji hidden" aria-label="이모티콘">
          <div class="messengerEmojiTabs" role="tablist"><button id="messengerEmojiTabSticker" type="button" role="tab" aria-selected="true" data-tab="sticker">이모티콘</button><button id="messengerEmojiTabGlyph" type="button" role="tab" aria-selected="false" data-tab="glyph">그림 글자</button><button id="messengerEmojiClose" class="messengerEmojiClose" type="button" aria-label="이모티콘 판 닫기">✕</button></div>
          <div id="messengerEmojiPreview" class="messengerEmojiPreview hidden"><button id="messengerEmojiSend" type="button" class="messengerEmojiBig" aria-label="이모티콘 보내기"><img alt="" /></button><span>한 번 더 누르면 보내요</span><button id="messengerEmojiPreviewClose" type="button" class="ghost tiny" aria-label="미리 보기 닫기">✕</button></div>
          <div id="messengerEmojiBody" class="messengerEmojiBody" role="tabpanel"></div>
        </div>
        <form id="messengerForm" class="messengerForm"><button id="messengerPhotoBtn" class="ghost messengerPhotoBtn" type="button" aria-label="사진 고르기" title="사진 고르기 (끌어 놓기·붙여넣기도 돼요)">📷</button><input id="messengerPhotoPick" type="file" accept="image/*" multiple hidden /><button id="messengerEmojiBtn" class="ghost messengerPhotoBtn" type="button" aria-label="이모티콘" aria-expanded="false" aria-controls="messengerEmoji" title="이모티콘">😊</button><textarea id="messengerInput" rows="1" maxlength="500" autocomplete="off" placeholder="메시지 입력" aria-label="메시지 입력"></textarea><button class="primary" type="submit">보내기</button></form>
      </section>
      <!-- 메신저 다듬기 A2: 사람 고르기 (새 대화방·초대·1:1) -- 이름 찾기, 고른 사람 알약, 한 줄에 한 사람(최근 대화한 사람 먼저), 방 이름은 아래 -->
      <form id="messengerPick" class="messengerPick hidden">
        <strong id="messengerPickTitle">새 대화방</strong>
        <input id="messengerPickFind" type="search" autocomplete="off" placeholder="이름 찾기" aria-label="이름 찾기" aria-controls="messengerPeople" />
        <div id="messengerPicked" class="messengerPicked hidden" aria-label="고른 사람"></div>
        <ul id="messengerPeople" class="messengerPeople" aria-label="사람"></ul>
        <input id="messengerPickName" type="text" maxlength="20" placeholder="방 이름 (안 써도 돼요)" aria-label="방 이름" />
        <div class="noticeFormActions"><button id="messengerPickGo" class="primary" type="submit" disabled>대화 시작</button><button id="messengerPickCancel" class="ghost" type="button">취소</button></div>
      </form>
    </div>
  </main>
  <div id="messengerViewer" class="messengerViewer hidden" role="dialog" aria-modal="true" aria-label="사진 크게 보기"><img id="messengerViewerImg" alt="" /><span id="messengerViewerCount" class="messengerViewerCount"></span><button id="messengerViewerPrev" class="ghost messengerViewerPrev" type="button" aria-label="이전 사진">‹</button><button id="messengerViewerNext" class="ghost messengerViewerNext" type="button" aria-label="다음 사진">›</button><button id="messengerViewerClose" class="ghost messengerViewerClose" type="button" aria-label="닫기">✕</button><div class="messengerViewerZoom"><button id="messengerZoomOut" class="ghost" type="button" aria-label="축소">−</button><span id="messengerZoomPct">100%</span><button id="messengerZoomIn" class="ghost" type="button" aria-label="확대">+</button></div></div>
  <!-- B6: 화면 안 작은 창 (이름 바꾸기·나가기·삭제) -- window.prompt / confirm 대신 -->
  <div id="mAsk" class="mAskBack hidden"><form id="mAskForm" class="mAsk isle-paper" role="dialog" aria-modal="true" aria-labelledby="mAskText"><p id="mAskText" class="mAskText"></p><input id="mAskInput" type="text" maxlength="20" autocomplete="off" aria-labelledby="mAskText" /><div class="noticeFormActions"><button id="mAskOk" class="primary" type="submit">확인</button><button id="mAskCancel" class="ghost" type="button">취소</button></div></form></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="/messenger-alert.js"></script>
  <script src="/messenger-zoom.js"></script>
  <script src="/messenger.js"></script>
</body>
</html>
