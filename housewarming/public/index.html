<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f7f4">
<title>우리 집들이 준비물 | 4인 공동 체크리스트</title>
<style>
:root{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#222b29;background:#f8f7f4;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.page{width:min(100% - 32px,880px);margin:0 auto;padding:22px 0 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 20px}
.logo{display:flex;gap:9px;align-items:center;font-size:13px;font-weight:800;letter-spacing:-.2px}.logo-icon{height:32px;width:32px;display:grid;place-items:center;border-radius:11px;background:#fee5cf;font-size:19px}.online{display:flex;align-items:center;gap:6px;font-size:12px;color:#66736e;background:#fff;border:1px solid #e7e9e4;border-radius:22px;padding:8px 11px}.dot{height:7px;width:7px;border-radius:50%;background:#31ad7a;display:inline-block}.offline .dot{background:#d87a63}
.hero{border-radius:23px;padding:30px 30px 24px;background:linear-gradient(125deg,#fbe4cb,#f8eadd 60%,#ffefe4);position:relative;overflow:hidden;border:1px solid #f4dac9;box-shadow:0 7px 25px #aa9b8c12}
.hero:after{content:"🥓";position:absolute;right:8px;top:0;font-size:125px;line-height:1.3;opacity:.22;transform:rotate(-12deg);pointer-events:none}.eyebrow{font-size:12px;font-weight:800;color:#99654c;letter-spacing:.9px}.hero h1{font-size:clamp(26px,4.5vw,40px);letter-spacing:-1.3px;line-height:1.18;margin:10px 0}.hero p{color:#735e55;font-size:14px;margin:0 0 18px}
.people{display:flex;align-items:center;gap:0;flex-wrap:wrap}.avatar{display:inline-grid;place-items:center;width:34px;height:34px;border:2px solid #fff;border-radius:50%;margin-right:-5px;color:#fff;font-size:12px;font-weight:800;background:#8eaa91}.avatar:nth-child(2){background:#c99785}.avatar:nth-child(3){background:#b6a3c4}.avatar:nth-child(4){background:#7a9fb0}.people-label{margin-left:15px;font-size:12px;color:#68594f;font-weight:650}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 14px}.section-title{font-size:19px;letter-spacing:-.7px;font-weight:800;margin:0}.small{font-size:12px;color:#7a847f}
.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid #eeeee9;border-radius:17px;padding:17px 16px;box-shadow:0 4px 14px #312f2510}.stat .label{display:block;color:#87908a;font-size:12px;margin-bottom:7px}.stat .big{font-size:23px;font-weight:850;letter-spacing:-.8px}.stat .tiny{font-size:11px;color:#a2a8a2}
.progress{height:7px;background:#eeeae5;border-radius:10px;margin-top:12px;overflow:hidden}.progress-bar{height:100%;background:#e58f62;border-radius:10px;transition:width .3s}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid #e3e7e0;background:#fff;color:#68756d;border-radius:999px;padding:11px 17px;white-space:nowrap;font-size:13px;font-weight:750;transition:.18s;min-width:max-content}.tab.active{background:#263f36;color:#fff;border-color:#263f36;box-shadow:0 4px 12px #263f3620}
.meat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.meat-card{border-radius:17px;background:#fff;border:1px solid #e8eae3;padding:16px;box-shadow:0 3px 16px #312f2510}.meat-card .meat-name{font-size:15px;font-weight:850;display:flex;gap:7px;align-items:center}.meat-card .qtyline{display:flex;align-items:baseline;gap:5px;margin:12px 0}.meat-card .qtyline strong{font-size:27px;font-weight:850;letter-spacing:-.9px}.meat-card .qtyline span{font-size:12px;color:#a0a7a1}.meat-card .controls{display:flex;align-items:center;gap:6px;margin-bottom:12px}.counter{background:#f3f5f1;border:1px solid #e7eae3;border-radius:10px;width:31px;height:34px;font-size:19px;font-weight:650;color:#496052}.meat-input{min-width:0;width:100%;padding:8px 5px;text-align:center;border-radius:10px;border:1px solid #e3e8e0;background:#fff;font-size:15px;font-weight:800;color:#263f36}
.field-select{width:100%;border:1px solid #e5e8e1;border-radius:9px;background:#fafbf9;padding:9px 10px;color:#43574b;font-size:12px;min-height:36px}.meat-card .checkline{display:flex;align-items:center;gap:8px;margin:12px 0 0;font-size:12px;font-weight:700;color:#61726b}.checkline input,.tick{accent-color:#4c936f;width:18px;height:18px;flex-shrink:0}
.main-card{background:#fff;border:1px solid #ebede7;border-radius:20px;padding:20px;box-shadow:0 5px 20px #312f250c}.list-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}.list-header h3{font-size:16px;letter-spacing:-.5px;margin:0}.muted{font-size:12px;color:#929a93}
.group-label{font-size:11px;color:#998d7e;text-transform:uppercase;font-weight:850;letter-spacing:.5px;background:#fbf8f3;padding:7px 10px;border-radius:8px;margin:20px 0 7px}
.item{display:flex;gap:11px;align-items:flex-start;padding:12px 5px;border-bottom:1px solid #eff0eb}.item:last-child{border-bottom:0}.item .tick{margin-top:8px}.item-main{min-width:0;flex:1}.item-title{width:100%;font-weight:720;line-height:1.35;font-size:14px;letter-spacing:-.2px;border:1px solid transparent;background:transparent;color:#2d3932;border-radius:7px;padding:4px 5px;margin-left:-5px}.item-title:hover,.item-title:focus{border-color:#d8e3da;background:#fff;outline:0}.item.done .item-title{text-decoration:line-through;color:#9da7a0}.item-sub{display:grid;grid-template-columns:minmax(65px,1fr) minmax(115px,1.1fr);gap:6px;margin-top:4px}.item-quantity{width:100%;border:1px solid #e8ebe6;border-radius:8px;padding:7px 9px;font-size:12px;color:#626d65;background:#fbfcfa;min-width:0}.delete{border:0;color:#b1b6ae;background:transparent;padding:6px 7px;border-radius:9px;font-size:17px;line-height:1}.delete:hover{background:#fff0ea;color:#be6f5c}
.add{margin-top:18px;border:1px dashed #d8ded4;border-radius:15px;background:#fcfdfb;padding:16px}.add-head{font-size:14px;font-weight:850;margin-bottom:12px}.add-grid{display:grid;grid-template-columns:2fr 1fr;gap:8px}.add input,.add select{width:100%;min-width:0;border:1px solid #dfe6db;border-radius:10px;padding:11px;background:#fff;font-size:13px;color:#34473c}.action{border:0;background:#263f36;color:#fff;border-radius:10px;padding:11px 15px;font-weight:800;font-size:13px}.secondary{background:#fff;color:#3d5347;border:1px solid #dfe5dc}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.empty{color:#a1a79f;font-size:13px;text-align:center;padding:30px 4px}.footer{margin-top:20px;text-align:center;color:#a2a7a0;font-size:11px;line-height:1.7}.toast{position:fixed;z-index:50;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:#263f36;color:#fff;border-radius:12px;padding:12px 17px;font-size:13px;font-weight:700;pointer-events:none;box-shadow:0 10px 30px #0002;transition:.25s;white-space:nowrap}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}.share{border:0;background:#263f36;color:#fff;border-radius:10px;padding:9px 13px;font-size:12px;font-weight:800}.error{background:#fff;border:1px solid #f0b5a9;border-radius:15px;margin-top:25px;padding:25px;color:#994a3c}
@media(max-width:650px){.page{width:min(100% - 24px,650px);padding-top:14px}.hero{padding:24px 22px}.hero:after{font-size:100px;right:-15px;top:20px}.overview{gap:8px}.stat{padding:13px 12px}.stat .big{font-size:21px}.meat-grid{grid-template-columns:1fr}.meat-card{padding:17px}.meat-card .controls{max-width:270px}.main-card{padding:15px}.hero h1{font-size:28px}.add-grid{grid-template-columns:1fr 1fr}.share{padding:8px 11px;font-size:11px}.head-row{margin:23px 0 12px}}
</style>
</head>
<body>
<div class="page">
  <header class="top"><div class="logo"><span class="logo-icon">🏠</span><span>OUR HOUSEWARMING</span></div><div class="online" id="online"><span class="dot"></span><span id="onlineText">연결 중</span></div></header>
  <section class="hero">
    <div class="eyebrow">2026. 11. 23. MONDAY · 4 PEOPLE</div>
    <h1>오늘, 우리 집에서<br>맛있게 놀자! 🥓</h1>
    <p>돼지고기 구이 + 비빔면 + 보드게임</p>
    <div class="people"><span class="avatar">희훈</span><span class="avatar">창민</span><span class="avatar">이건</span><span class="avatar">우성</span><span class="people-label">함께 준비하는 4명</span></div>
  </section>
  <div id="app"></div>
  <footer class="footer">링크를 가진 사람은 누구나 준비물을 수정할 수 있어요.<br>수정한 내용은 함께 접속한 친구에게 자동 반영됩니다.</footer>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  "use strict";
  var OWNERS=["공희훈","이창민","이건","김우성"];
  var MEATS=["삼겹살","목살","항정살"];
  var CAT=["식사 재료","조리 도구","식기·정리","음료·간식","보드게임","삼겹살","목살","항정살","기타"];
  var key=new URL(location.href).searchParams.get("key")||"";
  var active="전체", state=null, focused=false, pending=false, busy=false, toastTimeout=null, eventSource=null;
  var app=document.getElementById("app"), status=document.getElementById("online"), statusText=document.getElementById("onlineText");
  function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function qs(x){return document.querySelector(x);}
  function options(values,selected,empty){return (empty?'<option value="">'+esc(empty)+'</option>':"")+values.map(function(x){return '<option value="'+esc(x)+'"'+(x===selected?' selected':'')+'>'+esc(x)+'</option>';}).join("");}
  function api(path,opts){
    opts=opts||{};
    return fetch("/api"+path+(path.indexOf("?")<0?"?":"&")+"key="+encodeURIComponent(key),{
      method:opts.method||"GET",headers:{"Content-Type":"application/json"},body:opts.body===undefined?undefined:JSON.stringify(opts.body),cache:"no-store"
    }).then(async function(r){var d=await r.json();if(!r.ok)throw new Error(d.error||"네트워크 오류");return d;});
  }
  function toast(t){var el=qs("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toastTimeout);toastTimeout=setTimeout(function(){el.classList.remove("show");},2600);}
  function connected(value){status.classList.toggle("offline",!value);statusText.textContent=value?"공동 연결됨":"연결 확인 중";}
  function grams(n){return (n/1000).toLocaleString("ko-KR",{maximumFractionDigits:2})+"kg";}
  function store(){try{localStorage.setItem("housewarming-list-backup-"+key,JSON.stringify(state));}catch(_){}}
  async function load(){
    if(focused){pending=true;return;}
    try{
      var s=await api("/state");
      if(s.version===0){
        try{
          var backup=JSON.parse(localStorage.getItem("housewarming-list-backup-"+key)||"null");
          if(backup&&backup.version>0){
            try{await api("/restore",{method:"POST",body:backup});s=await api("/state");toast("이 기기에 저장된 목록을 복원했어요");}
            catch(_){s=await api("/state");}
          }
        }catch(_){}
      }
      state=s;store();connected(true);render();
    }catch(err){connected(false);if(!state)app.innerHTML='<div class="error"><b>목록을 불러올 수 없어요.</b><p>'+esc(err.message)+'</p><button class="action" onclick="location.reload()">새로고침</button></div>';}
  }
  async function change(path,body,method){
    if(busy)return;
    busy=true;
    try{await api(path,{method:method||"PATCH",body:body});await load();}
    catch(err){toast(err.message);await load();}
    finally{busy=false;}
  }
  function meatCard(name){
    var m=state.meats[name];
    return '<div class="meat-card" data-meat="'+esc(name)+'">'+
      '<div class="meat-name">'+(name==="삼겹살"?"🥓":name==="목살"?"🍖":"🥩")+' '+name+'</div>'+
      '<div class="qtyline"><strong>'+m.grams.toLocaleString("ko-KR")+'</strong><span>g</span></div>'+
      '<div class="controls"><button class="counter" data-step="-100" data-meat="'+esc(name)+'" aria-label="'+esc(name)+' 100그램 줄이기">−</button>'+
      '<input type="number" min="0" max="20000" step="100" inputmode="numeric" class="meat-input" data-meat="'+esc(name)+'" value="'+m.grams+'" aria-label="'+esc(name)+' 중량(g)">'+
      '<button class="counter" data-step="100" data-meat="'+esc(name)+'" aria-label="'+esc(name)+' 100그램 늘리기">+</button></div>'+
      '<select class="field-select meat-owner" data-meat="'+esc(name)+'">'+options(OWNERS,m.owner,"담당자 선택")+'</select>'+
      '<label class="checkline"><input type="checkbox" data-meat="'+esc(name)+'" class="meat-done"'+(m.done?' checked':'')+'> 준비 완료</label></div>';
  }
  function itemHtml(item){
    return '<div class="item'+(item.done?' done':'')+'" data-item="'+esc(item.id)+'">'+
      '<input class="tick item-done" aria-label="'+esc(item.name)+' 완료" type="checkbox" data-id="'+esc(item.id)+'"'+(item.done?' checked':'')+'>'+
      '<div class="item-main">'+
      '<input class="item-title" aria-label="준비물 이름" data-field="name" data-id="'+esc(item.id)+'" value="'+esc(item.name)+'">'+
      '<div class="item-sub"><input class="item-quantity" aria-label="수량" placeholder="수량 입력" data-field="quantity" data-id="'+esc(item.id)+'" value="'+esc(item.quantity)+'">'+
      '<select class="field-select item-owner" aria-label="담당자" data-field="owner" data-id="'+esc(item.id)+'">'+options(OWNERS,item.owner,"담당자 미정")+'</select></div>'+
      '</div><button class="delete" title="항목 삭제" aria-label="'+esc(item.name)+' 삭제" data-delete="'+esc(item.id)+'">✕</button></div>';
  }
  function groupHtml(items){
    var cats=[];
    items.forEach(function(x){if(cats.indexOf(x.category)<0)cats.push(x.category);});
    return cats.map(function(cat){
      return '<div class="group-label">'+esc(cat)+'</div>'+items.filter(function(x){return x.category===cat;}).map(itemHtml).join("");
    }).join("");
  }
  function render(){
    if(!state)return;
    var totalMeat=MEATS.reduce(function(n,k){return n+state.meats[k].grams;},0);
    var meatCount=MEATS.filter(function(k){return state.meats[k].grams>0;}).length;
    var doneMeats=MEATS.filter(function(k){return state.meats[k].grams>0&&state.meats[k].done;}).length;
    var finished=doneMeats+state.items.filter(function(x){return x.done;}).length;
    var total=meatCount+state.items.length;
    var pct=total?Math.round(finished/total*100):100;
    var pendingItems=state.items.filter(function(x){return !x.owner;});
    var pendingMeats=MEATS.filter(function(k){return state.meats[k].grams>0 && !state.meats[k].owner;});
    var pendingCount=pendingItems.length+pendingMeats.length;
    var isPending=active==="담당자 대기";
    var items=active==="전체"?state.items:isPending?pendingItems:state.items.filter(function(x){return x.category===active;});
    var selectedMeats=active==="전체"?MEATS:isPending?pendingMeats:[active];
    var meatArea=selectedMeats.length?'<div class="meat-grid">'+selectedMeats.map(meatCard).join("")+'</div>':'<div class="empty">담당자 배정이 필요한 고기는 없어요.</div>';
    app.innerHTML=
      '<div class="overview" style="margin-top:18px">'+
       '<div class="stat"><span class="label">전체 고기</span><span class="big">'+grams(totalMeat)+'</span><div class="tiny">1인당 '+Math.round(totalMeat/4)+'g</div></div>'+
       '<div class="stat"><span class="label">준비 완료</span><span class="big">'+finished+' <span class="tiny">/ '+total+'개</span></span><div class="progress"><div class="progress-bar" style="width:'+pct+'%"></div></div></div>'+
       '<div class="stat"><span class="label">담당자 대기</span><span class="big">'+pendingCount+'건</span><div class="tiny">미배정 준비물·고기</div></div></div>'+
      '<div class="head-row"><h2 class="section-title">고기 종류 · 수량</h2><button class="share" id="share">↗ 링크 공유</button></div>'+
      '<nav class="tabs" aria-label="고기 및 준비물 탭">'+["전체"].concat(MEATS,["담당자 대기"]).map(function(t){return '<button class="tab'+(active===t?' active':'')+'" data-tab="'+t+'">'+(t==="전체"?"📋 전체 준비물":t==="담당자 대기"?"👤 담당자 대기 ("+pendingCount+")":t)+"</button>";}).join("")+'</nav>'+
      meatArea+
      '<div class="head-row"><h2 class="section-title">'+(active==="전체"?"전체 준비물":isPending?"👤 담당자 배정 대기":"📍 "+active+" 추가 준비물")+'</h2><span class="small">'+items.filter(function(x){return x.done;}).length+' / '+items.length+' 완료</span></div>'+
      '<div class="main-card"><div class="list-header"><h3>체크리스트</h3><span class="muted">이름·수량을 직접 수정할 수 있어요</span></div>'+
      (items.length?groupHtml(items):isPending?'<div class="empty">담당자를 기다리는 준비물이 없어요. 🎉</div>':'<div class="empty">아직 등록된 준비물이 없어요.<br>아래에서 새 준비물을 추가해 주세요.</div>')+
      '<form class="add" id="addForm"><div class="add-head">＋ 새로운 준비물 추가</div>'+
      '<div class="add-grid"><input id="newName" placeholder="예: 버섯, 아이스박스" required maxlength="100" aria-label="준비물 이름"><input id="newQty" placeholder="수량 (예: 2개)" maxlength="40" aria-label="준비물 수량">'+
      '<select id="newCategory" aria-label="분류">'+options(CAT,(active==="전체"||isPending)?"기타":active,"")+'</select>'+
      '<select id="newOwner" aria-label="담당자">'+options(OWNERS,"","담당자 미정")+'</select></div>'+
      '<div class="actions"><button type="submit" class="action">준비물 추가하기 +</button></div></form></div>';
  }
  app.addEventListener("focusin",function(e){if(e.target.matches("input:not([type=checkbox])"))focused=true;});
  app.addEventListener("focusout",function(e){if(e.target.matches("input:not([type=checkbox])")){focused=false;if(pending){pending=false;setTimeout(load,180);}}});
  app.addEventListener("click",async function(e){
    var b=e.target.closest("button");if(!b)return;
    if(b.dataset.tab){active=b.dataset.tab;render();return;}
    if(b.id==="share"){try{await navigator.clipboard.writeText(location.href);toast("공유 링크를 복사했어요!");}catch(_){prompt("이 주소를 친구에게 보내 주세요",location.href);}return;}
    if(b.dataset.delete){
      var id=b.dataset.delete, item=state.items.find(function(x){return x.id===id;});
      if(!confirm("‘"+(item?item.name:"준비물")+"’ 항목을 삭제할까요?"))return;
      await change("/items/"+id,undefined,"DELETE");return;
    }
    if(b.dataset.step){
      var n=b.dataset.meat,d=Number(b.dataset.step),v=Math.max(0,(state.meats[n].grams||0)+d);
      await change("/meats/"+encodeURIComponent(n),{grams:v});return;
    }
  });
  app.addEventListener("change",async function(e){
    var t=e.target, id=t.dataset.id, m=t.dataset.meat;
    if(t.classList.contains("item-done"))return change("/items/"+id,{done:t.checked});
    if(t.classList.contains("meat-done"))return change("/meats/"+encodeURIComponent(m),{done:t.checked});
    if(t.classList.contains("meat-owner"))return change("/meats/"+encodeURIComponent(m),{owner:t.value});
    if(t.classList.contains("meat-input"))return change("/meats/"+encodeURIComponent(m),{grams:Number(t.value)});
    if(id && t.dataset.field){var data={};data[t.dataset.field]=t.value;return change("/items/"+id,data);}
  });
  app.addEventListener("submit",async function(e){
    if(e.target.id!=="addForm")return;e.preventDefault();
    var name=qs("#newName").value.trim();if(!name){toast("준비물 이름을 입력해 주세요");return;}
    await change("/items",{name:name,quantity:qs("#newQty").value,category:qs("#newCategory").value,owner:qs("#newOwner").value},"POST");
    toast("새 준비물을 추가했어요");
  });
  if(!key){app.innerHTML='<div class="error"><h3>공유 링크가 필요해요</h3><p>친구에게 받은 전체 링크를 열어 주세요.</p></div>';connected(false);return;}
  load();
  try{eventSource=new EventSource("/api/events?key="+encodeURIComponent(key));eventSource.onmessage=function(e){if(e.data==="change")load();};eventSource.onerror=function(){connected(false);};}catch(_){}
  setInterval(load,10000);
})();
</script>
</body></html>
