name: Apply lobby layout v1.6.3

on:
  push:
    branches: [lobby-layout-v163]
    paths:
      - 'scripts/apply-lobby-layout-v163.py'
      - '.github/workflows/apply-lobby-layout-v163.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply upgrade
        run: python3 scripts/apply-lobby-layout-v163.py
      - name: Validate syntax
        run: |
          node --check server.js
          node --check public/app.js
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run tests
        run: npm test
      - name: Verify lobby layout
        run: |
          grep -q 'lobbyTopGrid' public/index.html
          grep -q 'lobbyAdminCard' public/index.html
          grep -q 'Lobby layout v1.6.3' public/styles.css
          grep -q '"version": "1.6.3"' package.json
      - name: Remove one-shot migration files
        run: |
          rm -f scripts/apply-lobby-layout-v163.py
          rm -f .github/workflows/apply-lobby-layout-v163.yml
      - name: Commit applied upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rearrange lobby: game and chat side-by-side, admin below [v163-applied]'
          git push origin HEAD:lobby-layout-v163
