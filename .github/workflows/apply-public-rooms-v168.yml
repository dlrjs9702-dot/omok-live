name: Integrate public rooms and invitations v1.6.8
on:
  push:
    branches: [feature-public-rooms-invites-v168]
    paths: ['.github/workflows/apply-public-rooms-v168.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded backend changes
        run: python3 scripts/apply-public-rooms-server-v168.py
      - name: Apply guarded lobby and invite UI
        run: python3 scripts/apply-public-rooms-ui-v168.py
      - name: Validate JS syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check test/public-rooms-invites.test.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete test suite
        run: npm test
      - name: Verify release and privacy boundaries
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const server = fs.readFileSync('server.js', 'utf8');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const app = fs.readFileSync('public/app.js', 'utf8');
          if (!server.includes("version: '1.6.8'")) throw new Error('bad release version');
          if (!server.includes("room.visibility !== 'public'")) throw new Error('no private room boundary');
          if (!server.includes("invite.toToken !== session.token")) throw new Error('invitations not private');
          if (!html.includes('id="publicRoomsCard"') || !html.includes('id="roomInvitePanel"')) throw new Error('missing public rooms/invites UI');
          if (!html.includes('v=1.6.8') || !app.includes("api('/api/lobby/players')")) throw new Error('missing refreshed frontend');
          if (/자동 매칭|빠른 대전/.test(html)) throw new Error('excluded matchmaking feature present');
          console.log('Public rooms, invitation and privacy release checks passed');
          NODE
      - name: Remove one-shot editing files
        run: rm -f scripts/apply-public-rooms-server-v168.py scripts/apply-public-rooms-ui-v168.py .github/workflows/apply-public-rooms-v168.yml
      - name: Commit tested implementation to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add public room listing and targeted invites without matchmaking [v168-applied]'
          git push
