name: Integrate compact announcements v1.6.6
on:
  push:
    branches: [feature-announcements-compact-v166]
    paths:
      - '.github/workflows/apply-announcements-v166.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded server, markup, application and style changes
        run: |
          python3 scripts/apply-announcements-server-v166.py
          python3 scripts/apply-announcements-html-v166.py
          python3 scripts/apply-announcements-app-v166.py
          python3 scripts/apply-announcements-css-v166.py
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check lib/announcement-store.js
          node --check test/announcements.test.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run existing games and new announcement tests
        run: npm test
      - name: Validate release strings and server-only database changes
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('server.js','utf8');
          const html = fs.readFileSync('public/index.html','utf8');
          if (!s.includes("version: '1.6.6'")) throw Error('health version incorrect');
          if (!s.includes('if (!requireAdmin(req, res)) return;')) throw Error('missing auth');
          if (!html.includes('id="announcementsCard"') || !html.includes('v=1.6.6')) throw Error('missing UI or cache version');
          if (!fs.existsSync('lib/announcement-store.js')) throw Error('missing persistence');
          console.log('Release assertions passed');
          NODE
      - name: Remove one-time helpers and workflow
        run: |
          rm -f scripts/apply-announcements-server-v166.py scripts/apply-announcements-html-v166.py scripts/apply-announcements-app-v166.py scripts/apply-announcements-css-v166.py .github/workflows/apply-announcements-v166.yml
      - name: Commit verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add persistent admin announcements and compact game help [v166-applied]'
          git push
