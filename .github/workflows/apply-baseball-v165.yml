name: Integrate number baseball v1.6.5
on:
  push:
    branches: [feature-number-baseball-v165]
    paths: [.github/workflows/apply-baseball-v165.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize nested template literals
        run: node scripts/normalize-baseball-script-v165.cjs
      - name: Check migration script
        run: node --check scripts/apply-baseball-v165.cjs
      - name: Integrate routes and UI
        run: node scripts/apply-baseball-v165.cjs
      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check lib/games/baseball.js
          node --check lib/games/index.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run all game and persistence tests
        run: npm test
      - name: Assert hidden secrets and integrated controls
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const server = fs.readFileSync('server.js','utf8');
          const app = fs.readFileSync('public/app.js','utf8');
          const html = fs.readFileSync('public/index.html','utf8');
          const engine = fs.readFileSync('lib/games/baseball.js','utf8');
          for (const piece of ['set-secret|guess|move','mySecret: room.gameType',"if (!seat) return sendError(res, 403, 'SPECTATOR'"]) {
            if (!server.includes(piece)) throw new Error(`Missing server check: ${piece}`);
          }
          for (const piece of ['renderBaseball()', 'sendBaseballAction(', "state?.gameType === 'baseball'", 'moveCountLabel']) {
            if (!app.includes(piece)) throw new Error(`Missing game UI: ${piece}`);
          }
          for (const id of ['baseballPanel','baseballSecretForm','baseballGuessForm','baseballHistory']) {
            if (!html.includes(`id="${id}"`)) throw new Error(`Missing baseball control: ${id}`);
          }
          if (!html.includes('?v=1.6.5')) throw new Error('Assets are not cache-busted');
          if (/secrets:\s*game\.secrets/.test(engine)) throw new Error('Public state exposes secrets');
          console.log('Secret isolation, role guards, game-specific UI and asset version validated.');
          NODE
      - name: Remove one-shot integration helpers
        run: |
          rm -f scripts/apply-baseball-v165.cjs scripts/normalize-baseball-script-v165.cjs .github/workflows/apply-baseball-v165.yml
          rmdir scripts 2>/dev/null || true
      - name: Commit tested game update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate two-player number baseball v1.6.5 [baseball165-applied]'
          git push
