name: Playwright E2E

# A pull request runs once (pull_request); a push runs only on main (after a merge). A push to a PR branch used to run
# the same suite a second time, doubling the runner time and the chance of meeting a flaky test.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # A normal run took 8–15 minutes, by 2026-10 20–37 (more 3D tests on a software renderer). Without a limit a hung
    # step waits for GitHub's 6-hour default.
    # v1.10.32: past the 40-minute limit (docs/release.md: split rather than raise it) -- the browser tests in two
    # shards side by side; the static checks and npm test once, in the first. v1.10.41: three shards (the island's
    # October night and the town hall made the plaza tests slower; a shard went past 40 minutes)
    # v1.10.47: one shard reached 39.3m while the others took 6-8m. Split the two 3D suites from general games.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [games-1, games-2, assets, plaza]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static checks
        run: |
          git diff --check origin/main...HEAD
          node --check server.js
          node --check public/app.js
          node --check public/gostop-ui.js
          node --check lib/point-store.js
          node --check lib/release-announcements.js
          node --check test/point-store.test.js
          node --check test/gostop-server.test.js
          node --check tests/e2e/gostop-rules-settlement.spec.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The runner's apt mirror sometimes stops answering (2026-09-30: stuck 53 minutes in apt update).
      # Normally 30 s to 7 min, so each attempt gets 10 minutes and a stuck one is retried once.
      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2; do
            timeout 10m npx playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright install attempt $attempt failed or timed out"
            # timeout only stops npx; a hung apt-get (run as root) could keep the apt lock and block the retry
            sudo pkill -f apt-get || true
          done
          exit 1

      - name: Run unit and integration tests
        if: ${{ matrix.group == 'games-1' }}
        run: npm test

      # Disjoint groups retain the full desktop suite. Mobile runs whole with the general-group filter cleared.
      - name: Run browser tests
        env:
          PLAYWRIGHT_TEST_GROUP: ${{ matrix.group }}
        run: |
          case "$PLAYWRIGHT_TEST_GROUP" in
            games-*) npm run test:e2e -- --project=chromium --shard=${PLAYWRIGHT_TEST_GROUP#games-}/2 ;;
            assets) npm run test:e2e -- --project=chromium tests/e2e/island-assets.spec.js ;;
            plaza) npm run test:e2e -- --project=chromium tests/e2e/plaza.spec.js ;;
          esac
          if [ "$PLAYWRIGHT_TEST_GROUP" = "games-2" ]; then PLAYWRIGHT_TEST_GROUP= npm run test:e2e -- --project=mobile-chromium; fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.group }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload browser test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.group }}
          path: test-results/
          if-no-files-found: ignore
