name: Playwright E2E

# A pull request runs once (pull_request); a push runs only on main (after a merge). A push to a PR branch used to run
# the same suite a second time, doubling the runner time and the chance of meeting a flaky test.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per PR: a new push cancels the PR's run still in progress (main runs are keyed by SHA, so they never cancel).
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # v1.10.98 CI 단축 (사용자 2026-10-19, docs/ci-speedup-20261019.md): the suite in parts side by side -- npm test alone,
  # the general games in three shards and their phone run, the two asset specs, the island specs on PC in three shards and
  # on a phone. The repository is public: runner time is free, so the parts run at once and a PR waits for the longest
  # (the plaza group used to run PC then phone in one job: 50-75 minutes). docs/release.md: split rather than raise the limit.
  part:
    name: e2e part (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [unit, games-1, games-2, games-3, games-mobile, assets, plaza-1, plaza-2, plaza-3, plaza-mobile]
    env:
      # the island's 3D specs (playwright.config.js keeps them out of the games parts); on a phone those that differ there
      PLAZA_PC: >-
        tests/e2e/plaza.spec.js tests/e2e/river-fishing.spec.js tests/e2e/weed-board.spec.js tests/e2e/island-time.spec.js tests/e2e/island-weather.spec.js tests/e2e/island-stars.spec.js tests/e2e/island-contest.spec.js tests/e2e/island-admin-look.spec.js tests/e2e/island-plants.spec.js tests/e2e/island-together.spec.js tests/e2e/island-guide.spec.js tests/e2e/island-insects.spec.js tests/e2e/island-pets.spec.js tests/e2e/asset-inspector.spec.js tests/e2e/shop-browse.spec.js tests/e2e/title-hall.spec.js tests/e2e/action-lock.spec.js tests/e2e/resident-talk.spec.js tests/e2e/transform-shop.spec.js tests/e2e/general-store.spec.js tests/e2e/mayor-gait.spec.js tests/e2e/island-solids.spec.js
      PLAZA_MOBILE: >-
        tests/e2e/river-fishing.spec.js tests/e2e/weed-board.spec.js tests/e2e/island-time.spec.js tests/e2e/island-weather.spec.js tests/e2e/island-stars.spec.js tests/e2e/island-contest.spec.js tests/e2e/island-admin-look.spec.js tests/e2e/island-plants.spec.js tests/e2e/island-together.spec.js tests/e2e/island-guide.spec.js tests/e2e/island-insects.spec.js tests/e2e/island-pets.spec.js tests/e2e/shop-browse.spec.js tests/e2e/title-hall.spec.js tests/e2e/resident-talk.spec.js tests/e2e/transform-shop.spec.js tests/e2e/general-store.spec.js

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static checks
        if: ${{ matrix.group == 'unit' }}
        run: |
          git diff --check origin/main...HEAD
          node --check server.js
          node --check public/app.js
          node --check public/gostop-ui.js
          node --check lib/point-store.js
          node --check lib/release-announcements.js
          node --check test/point-store.test.js
          node --check test/gostop-server.test.js
          node --check tests/e2e/gostop-rules-settlement.spec.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The runner's apt mirror sometimes stops answering (2026-09-30: stuck 53 minutes in apt update).
      # Normally 30 s to 7 min, so each attempt gets 10 minutes and a stuck one is retried once.
      - name: Install Playwright Chromium
        if: ${{ matrix.group != 'unit' }}
        run: |
          for attempt in 1 2; do
            timeout 10m npx playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright install attempt $attempt failed or timed out"
            # timeout only stops npx; a hung apt-get (run as root) could keep the apt lock and block the retry
            sudo pkill -f apt-get || true
          done
          exit 1

      - name: Run unit and integration tests
        if: ${{ matrix.group == 'unit' }}
        run: npm test

      # The parts are disjoint and together the whole suite. The plaza parts stop after 10 failures (a broken run does not
      # hold a runner for an hour).
      - name: Run browser tests
        if: ${{ matrix.group != 'unit' }}
        env:
          GROUP: ${{ matrix.group }}
        run: |
          case "$GROUP" in
            games-mobile) PLAYWRIGHT_SKIP_ISLAND=1 npm run test:e2e -- --project=mobile-chromium ;;
            games-*) PLAYWRIGHT_TEST_GROUP=$GROUP npm run test:e2e -- --project=chromium --shard=${GROUP#games-}/3 ;;
            assets) npm run test:e2e -- --project=chromium tests/e2e/island-assets.spec.js tests/e2e/native-assets.spec.js ;;
            plaza-mobile) npm run test:e2e -- --project=mobile-chromium --max-failures=10 $PLAZA_MOBILE ;;
            plaza-*) npm run test:e2e -- --project=chromium --max-failures=10 --shard=${GROUP#plaza-}/3 $PLAZA_PC ;;
          esac

      - name: Upload Playwright report
        if: ${{ !cancelled() && matrix.group != 'unit' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.group }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload browser test results
        if: ${{ !cancelled() && matrix.group != 'unit' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.group }}
          path: test-results/
          if-no-files-found: ignore

  # main's protection asks for these four names (e2e (games-1), (games-2), (assets), (plaza)): each waits for every part and
  # passes only if all of them did. always(): a gate skipped because a part failed would count as passed (GitHub treats a
  # skipped required check as success) -- so a gate always runs and fails itself instead.
  e2e:
    name: e2e (${{ matrix.gate }})
    needs: part
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        gate: [games-1, games-2, assets, plaza]
    steps:
      - name: Every part passed
        run: |
          echo "parts: ${{ needs.part.result }}"
          test "${{ needs.part.result }}" = "success"
