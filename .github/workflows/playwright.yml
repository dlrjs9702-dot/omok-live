name: Playwright E2E

# A pull request runs once (pull_request); a push runs only on main (after a merge). A push to a PR branch used to run
# the same suite a second time, doubling the runner time and the chance of meeting a flaky test.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per PR: a new push cancels the PR's run still in progress (main runs are keyed by SHA, so they never cancel).
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # v1.10.98 CI 단축 (사용자 2026-10-19, docs/ci-speedup-20261019.md): the suite in parts side by side. The repository is
  # public: runner time is free, so the parts run at once and a PR waits for the longest. docs/release.md: split rather
  # than raise the limit. 2차 단축 (사용자 「두 가지 다 해 보자」): by time, not by count or by file -- npm test alone, every
  # spec on PC in fourteen parts and the phone run in three, each about 10 minutes of tests by the table (a runner takes up to a third more; with setup, under 15) (tools/ci-split.js over
  # tools/ci-timings.json; the assets and plaza parts were 30 minutes and decided every run).
  part:
    name: e2e part (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [unit, chromium-1, chromium-2, chromium-3, chromium-4, chromium-5, chromium-6, chromium-7, chromium-8, chromium-9, chromium-10, chromium-11, chromium-12, chromium-13, chromium-14, mobile-1, mobile-2, mobile-3]
    env:
      # (the island's 3D specs on PC: since 2차 단축 every spec runs on PC, kept for reference until the next tidy)
      PLAZA_PC: >-
        tests/e2e/plaza.spec.js tests/e2e/river-fishing.spec.js tests/e2e/weed-board.spec.js tests/e2e/island-time.spec.js tests/e2e/island-weather.spec.js tests/e2e/island-stars.spec.js tests/e2e/island-contest.spec.js tests/e2e/island-admin-look.spec.js tests/e2e/island-plants.spec.js tests/e2e/island-together.spec.js tests/e2e/island-guide.spec.js tests/e2e/island-insects.spec.js tests/e2e/island-pets.spec.js tests/e2e/asset-inspector.spec.js tests/e2e/shop-browse.spec.js tests/e2e/title-hall.spec.js tests/e2e/action-lock.spec.js tests/e2e/resident-talk.spec.js tests/e2e/transform-shop.spec.js tests/e2e/general-store.spec.js tests/e2e/mayor-gait.spec.js tests/e2e/island-solids.spec.js tests/e2e/dalmaru-walk.spec.js tests/e2e/dress-room.spec.js
      PLAZA_MOBILE: >-
        tests/e2e/river-fishing.spec.js tests/e2e/weed-board.spec.js tests/e2e/island-time.spec.js tests/e2e/island-weather.spec.js tests/e2e/island-stars.spec.js tests/e2e/island-contest.spec.js tests/e2e/island-admin-look.spec.js tests/e2e/island-plants.spec.js tests/e2e/island-together.spec.js tests/e2e/island-guide.spec.js tests/e2e/island-insects.spec.js tests/e2e/island-pets.spec.js tests/e2e/shop-browse.spec.js tests/e2e/title-hall.spec.js tests/e2e/resident-talk.spec.js tests/e2e/transform-shop.spec.js tests/e2e/general-store.spec.js tests/e2e/dress-room.spec.js

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Static checks
        if: ${{ matrix.group == 'unit' }}
        run: |
          git diff --check origin/main...HEAD
          node --check server.js
          node --check public/app.js
          node --check public/gostop-ui.js
          node --check lib/point-store.js
          node --check lib/release-announcements.js
          node --check test/point-store.test.js
          node --check test/gostop-server.test.js
          node --check tests/e2e/gostop-rules-settlement.spec.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CI 3차: the browser from the cache (one download per Playwright version) -- a download mirror failing to resolve
      # (playwright.download.prss.microsoft.com ENOTFOUND, #267·#268 chromium-4) cost the part its retries over again
      - name: Cache Playwright browsers
        if: ${{ matrix.group != 'unit' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The runner's apt mirror sometimes stops answering (2026-09-30: stuck 53 minutes in apt update).
      # Normally 30 s to 7 min, so each attempt gets 10 minutes and a stuck one is retried once.
      - name: Install Playwright Chromium
        if: ${{ matrix.group != 'unit' }}
        run: |
          for attempt in 1 2; do
            timeout 10m npx playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright install attempt $attempt failed or timed out"
            # timeout only stops npx; a hung apt-get (run as root) could keep the apt lock and block the retry
            sudo pkill -f apt-get || true
          done
          exit 1

      # CI 3차: the failed tests' names also as annotations (the checks API serves them; the logs need a download)
      - name: Run unit and integration tests
        if: ${{ matrix.group == 'unit' }}
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test.log

      - name: Unit test failures as annotations
        if: ${{ failure() && matrix.group == 'unit' }}
        run: |
          # each failed test's name and the first line of its error (the TAP block under it)
          awk '/^[[:space:]]*not ok /{ if (n) print "::error title=unit test failed::" n e; n=$0; sub(/^[[:space:]]*not ok [0-9]+ - /, "", n); e=""; w=1; next }
               w && /^[[:space:]]*error:/ { x=$0; sub(/^[[:space:]]*error:[[:space:]]*[|>-]*[[:space:]]*/, "", x); if (x == "") { getline x; gsub(/^[[:space:]]+/, "", x) } e=" -- " x; w=0 }
               END { if (n) print "::error title=unit test failed::" n e }' unit-test.log | head -10 || true

      # The parts are disjoint and together the whole suite (tools/ci-split.js checks every test is in exactly one part;
      # a split that fails stops the part -- never an empty list, which would run everything). A part stops after 10
      # failures (a broken run does not hold a runner for an hour).
      - name: Run browser tests
        if: ${{ matrix.group != 'unit' }}
        env:
          GROUP: ${{ matrix.group }}
        run: |
          case "$GROUP" in
            chromium-*) PROJECT=chromium; LIST=$(node tools/ci-split.js chromium 14 ${GROUP#chromium-}) || exit 1 ;;
            mobile-*) PROJECT=mobile-chromium; LIST=$(node tools/ci-split.js mobile 3 ${GROUP#mobile-}) || exit 1 ;;
            *) echo "unknown part $GROUP"; exit 1 ;;
          esac
          test -n "$LIST" || exit 1
          npm run test:e2e -- --project=$PROJECT --max-failures=10 $LIST

      - name: Upload Playwright report
        if: ${{ !cancelled() && matrix.group != 'unit' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.group }}
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload browser test results
        if: ${{ !cancelled() && matrix.group != 'unit' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.group }}
          path: test-results/
          if-no-files-found: ignore

  # main's protection asks for these four names (e2e (games-1), (games-2), (assets), (plaza)): each waits for every part and
  # passes only if all of them did (the names stay: the parts behind them changed in 2차 단축). always(): a gate skipped because a part failed would count as passed (GitHub treats a
  # skipped required check as success) -- so a gate always runs and fails itself instead.
  e2e:
    name: e2e (${{ matrix.gate }})
    needs: part
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false # (CI 3차: all four fail together -- one failing gate used to cancel the other three)
      matrix:
        gate: [games-1, games-2, assets, plaza]
    steps:
      - name: Every part passed
        run: |
          echo "parts: ${{ needs.part.result }}"
          test "${{ needs.part.result }}" = "success"
