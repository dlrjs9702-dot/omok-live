name: Verify v1.6.75 release consistency hotfix

on:
  push:
    branches:
      - fix/v1675-start-log-20260924
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1675-start-log-20260924
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax and diff checks
        run: |
          node --check server.js
          node --check test/release-version.test.js
          git diff --check origin/main...HEAD
      - name: Release consistency test
        run: node --test test/release-version.test.js
      - name: Complete regression suite
        run: npm test
