name: Apply and test Omok 2v2 v1.6.9
on:
  push:
    branches: [feature-omok-team-v169]
    paths: ['.github/workflows/apply-omok-team-v169.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guarded team engine server integration
        run: python3 scripts/apply-omok-team-server-v169.py
      - name: Guarded lobby and game room integration
        run: python3 scripts/apply-omok-team-ui-v169.py
      - name: Syntax check
        run: |
          node --check server.js
          node --check lib/games/omok2v2.js
          node --check public/app.js
          node --check test/omok-team.test.js
      - name: Install and run all tests
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Confirm release and legacy boundaries
        run: |
          grep -Fq "version: '1.6.9'" server.js
          grep -Fq 'v=1.6.9' public/index.html
          grep -Fq 'id="teamRoleButtons"' public/index.html
          grep -Fq "const isTeam" server.js
          node --check lib/games/omok.js
      - name: Remove one-shot scripts and workflow
        run: rm -f scripts/apply-omok-team-server-v169.py scripts/apply-omok-team-ui-v169.py .github/workflows/apply-omok-team-v169.yml
      - name: Commit tested implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Launch four-player team omok with strict turns and pause recovery [v169-applied]'
          git push
