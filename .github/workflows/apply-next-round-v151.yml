name: Apply next-round flow v1.5.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply upgrade
        run: python3 scripts/apply-next-round-v151.py
      - name: Validate syntax
        run: |
          node --check server.js
          node --check public/app.js
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run tests
        run: npm test
      - name: Verify next-round semantics
        run: |
          grep -q "action === 'next-round'" server.js
          grep -q "다음 판 준비" public/index.html
          grep -q "roomAction('next-round')" public/app.js
      - name: Remove one-shot migration files
        run: rm -f .github/workflows/apply-next-round-v151.yml scripts/apply-next-round-v151.py
      - name: Commit applied upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Allow any room participant to open next round [v151-applied]"
          git push
