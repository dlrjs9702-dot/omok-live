name: Temporary verify Twenty Questions drawer chat lock

on:
  push:
    branches:
      - feature/twenty-drawer-chat-lock-20260923

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check server.js
          node --check public/app.js
          node --check test/twentyquestions-server.test.js
          git diff --check HEAD^ HEAD
      - name: Targeted Twenty Questions test
        run: node --test test/twentyquestions-server.test.js
      - name: Full regression suite
        run: npm test
