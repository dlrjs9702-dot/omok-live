name: Harden baseball server and end-to-end test
on:
  push:
    branches: [feature-number-baseball-v165]
    paths: [.github/workflows/harden-baseball-v165.yml]
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject board moves in non-board game rooms
        run: |
          python3 <<'PY'
          from pathlib import Path
          file = Path('server.js')
          source = file.read_text()
          original = "  if (action === 'move') {\n    const seat = findSeat(room, session.token);"
          fixed = "  if (action === 'move') {\n    if (room.gameType === 'baseball') return sendError(res, 400, 'WRONG_GAME', '숫자야구는 숫자 추측 기능을 이용해 주세요.');\n    const seat = findSeat(room, session.token);"
          if source.count(original) != 1: raise SystemExit('Expected board move guard anchor once')
          file.write_text(source.replace(original, fixed))
          PY
      - name: Validate syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check lib/games/baseball.js
          node --check test/baseball-server.test.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests including real HTTP gameplay and secret isolation
        run: npm test
      - name: Remove temporary workflow
        run: rm -f .github/workflows/harden-baseball-v165.yml
      - name: Commit verified guard and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reject invalid baseball board moves and verify real HTTP gameplay [baseball165-hardened]'
          git push
