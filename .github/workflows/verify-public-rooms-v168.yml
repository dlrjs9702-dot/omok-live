name: Test and integrate public rooms v1.6.8
on:
  push:
    branches: [feature-public-rooms-invites-v168]
    paths: ['.github/workflows/verify-public-rooms-v168.yml']
permissions:
  contents: write
jobs:
  test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate guarded implementation
        run: |
          python3 scripts/apply-public-rooms-server-v168.py
          python3 scripts/apply-public-rooms-ui-v168.py
          python3 scripts/fix-public-room-port-v168.py
      - name: Check source syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check test/public-rooms-invites.test.js
      - name: Install and run all tests
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Verify release assets and feature exclusions
        run: |
          grep -Fq "version: '1.6.8'" server.js
          grep -Fq 'v=1.6.8' public/index.html
          grep -Fq 'id="publicRoomsCard"' public/index.html
          grep -Fq 'id="roomInvitePanel"' public/index.html
          grep -Fq "invite.toToken !== session.token" server.js
          grep -Fq "room.visibility !== 'public'" server.js
          if grep -Eq '자동 매칭|빠른 대전' public/index.html; then exit 1; fi
      - name: Remove one-time patch files
        run: rm -f scripts/apply-public-rooms-server-v168.py scripts/apply-public-rooms-ui-v168.py scripts/fix-public-room-port-v168.py .github/workflows/apply-public-rooms-v168.yml .github/workflows/retry-public-rooms-v168.yml .github/workflows/verify-public-rooms-v168.yml
      - name: Commit tested feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add lobby public rooms and invitation flow without auto matchmaking [v168-applied]'
          git push
