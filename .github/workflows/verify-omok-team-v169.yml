name: Verify and commit Omok 2v2 v1.6.9
on:
  push:
    branches: [feature-omok-team-v169]
    paths: ['.github/workflows/verify-omok-team-v169.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded integration
        run: |
          python3 scripts/apply-omok-team-server-v169.py
          python3 scripts/apply-omok-team-ui-v169.py
      - name: Update legacy fixed game count tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/announcements.test.js')
          old="assert.equal((html.match(/class=\"gameRuleDetails\"/g) || []).length, 3);"
          s=p.read_text()
          assert s.count(old)==1
          p.write_text(s.replace(old,old.replace('length, 3','length, 4')))
          p=Path('test/baseball.test.js')
          old="assert.deepEqual(listGames().map(x => x.id).sort(), ['baseball','omok','othello']);"
          s=p.read_text()
          assert s.count(old)==1
          p.write_text(s.replace(old,"assert.deepEqual(listGames().map(x => x.id).sort(), ['baseball','omok','omok2v2','othello']);"))
          PY
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check lib/games/omok2v2.js
          node --check test/omok-team.test.js
      - name: Install and execute full test suite
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Validate deployment assets, modes and privacy
        run: |
          grep -Fq "version: '1.6.9'" server.js
          grep -Fq 'v=1.6.9' public/index.html
          grep -Fq 'id="teamRoleButtons"' public/index.html
          grep -Fq 'id="standardPlayers"' public/index.html
          grep -Fq 'guestKeyId: session.guestKeyId' server.js
          grep -Fq "room.game.nextSeat !== seat" server.js
          grep -Fq "room.visibility !== 'public'" server.js
          node --check lib/games/omok.js
      - name: Remove one-shot tooling
        run: rm -f scripts/apply-omok-team-server-v169.py scripts/apply-omok-team-ui-v169.py .github/workflows/apply-omok-team-v169.yml .github/workflows/verify-omok-team-v169.yml
      - name: Commit and push verified implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enable 2v2 Omok with four-seat turns and recovery [v169-applied]'
          git push
