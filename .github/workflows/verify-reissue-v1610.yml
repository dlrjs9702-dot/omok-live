name: Verify guest file reissue v1.6.10
on:
  push:
    branches: [feature-reissue-guest-files-v1610]
    paths: [.github/workflows/verify-reissue-v1610.yml]
permissions:
  contents: write
jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded source changes
        run: python3 scripts/apply-reissue-v1610.py
      - name: Verify JavaScript syntax
        run: |
          node --check server.js
          node --check lib/access-store.js
          node --check public/app.js
          node --check test/reissue-guest-file.test.js
      - name: Run complete test suite
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Verify version, authorization and credential boundaries
        run: |
          grep -Fq "version: '1.6.10'" server.js
          grep -Fq 'app.js?v=1.6.10' public/index.html
          grep -Fq 'styles.css?v=1.6.10' public/index.html
          grep -Fq 'invalidateGuestSessions(row.id,' server.js
          grep -Fq 'WHERE id = $1 AND revoked_at IS NULL' lib/access-store.js
          grep -Fq '재발급' public/app.js
      - name: Remove temporary implementation tooling
        run: rm -f scripts/apply-reissue-v1610.py .github/workflows/verify-reissue-v1610.yml
      - name: Commit only tested implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add admin-only guest entry reissue with token rotation [v1610-applied]'
          git push
