name: Fix expandable game rules width v1.6.6
on:
  push:
    branches: [feature-announcements-compact-v166]
    paths: ['.github/workflows/fix-rule-detail-width-v166.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make expanded rule details fill each game option
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/styles.css')
          text = p.read_text()
          assert '.gameOption .gameChoice{' in text
          assert '.gameRuleDetails p{' in text
          text += '\n/* Keep expanded rules legible: details must not shrink to summary width. */\n.gameOption .gameRuleDetails{align-self:stretch;width:100%}\n.gameOption .gameRuleDetails p,.gameOption[data-game-option="baseball"] .gameRuleDetails p{width:100%;max-width:none}\n'
          p.write_text(text)
          PY
      - name: Test all server and UI checks
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Commit CSS fix without temporary workflow
        run: |
          rm -f .github/workflows/fix-rule-detail-width-v166.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Allow expanded game rules to use card width [v166-width-fix]'
          git push
