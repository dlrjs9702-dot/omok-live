name: Verify public rooms and invitations v1.6.8
on:
  push:
    branches: [feature-public-rooms-invites-v168]
    paths: ['.github/workflows/retry-public-rooms-v168.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded backend and frontend patches
        run: |
          python3 scripts/apply-public-rooms-server-v168.py
          python3 scripts/apply-public-rooms-ui-v168.py
      - name: Fix ephemeral test port lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/public-rooms-invites.test.js')
          t = p.read_text()
          before = """    s.listen(0, '127.0.0.1', () => s.close(() => resolve(s.address()?.port || port)));
              let port;
              s.on('listening', () => { port = s.address().port; });"""
          old = """    s.listen(0, '127.0.0.1', () => s.close(() => resolve(s.address()?.port || port)));
    let port;
    s.on('listening', () => { port = s.address().port; });"""
          new = """    s.listen(0, '127.0.0.1', () => {
      const port = s.address().port;
      s.close(() => resolve(port));
    });"""
          if t.count(old) != 1: raise RuntimeError('Test port anchor changed')
          p.write_text(t.replace(old, new, 1))
          PY
      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check test/public-rooms-invites.test.js
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run all tests
        run: npm test
      - name: Verify privacy and excluded matchmaking
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const server = fs.readFileSync('server.js', 'utf8');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const app = fs.readFileSync('public/app.js', 'utf8');
          if (!server.includes("version: '1.6.8'")) throw new Error('bad release version');
          if (!server.includes("room.visibility !== 'public'")) throw new Error('missing private room boundary');
          if (!server.includes("invite.toToken !== session.token")) throw new Error('invitations not private');
          if (!html.includes('id="publicRoomsCard"') || !html.includes('id="roomInvitePanel"')) throw new Error('missing new UI');
          if (!html.includes('v=1.6.8') || !app.includes("api('/api/lobby/players')")) throw new Error('missing frontend updates');
          if (/자동 매칭|빠른 대전/.test(html)) throw new Error('excluded matchmaking present');
          console.log('Public rooms and invitation release checks passed');
          NODE
      - name: Remove one-shot patch and workflow files
        run: rm -f scripts/apply-public-rooms-server-v168.py scripts/apply-public-rooms-ui-v168.py .github/workflows/apply-public-rooms-v168.yml .github/workflows/retry-public-rooms-v168.yml
      - name: Commit tested changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enable public room browser and invitation flow without matchmaking [v168-applied]'
          git push
