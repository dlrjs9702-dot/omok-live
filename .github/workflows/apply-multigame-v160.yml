name: Apply multi-game Othello v1.6.0

on:
  push:
    branches: [multi-game-othello-v160]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply migration
        run: python3 scripts/apply-multigame-v160.py
      - name: Validate syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check lib/games/index.js
          node --check lib/games/omok.js
          node --check lib/games/othello.js
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run tests
        run: npm test
      - name: Verify multi-game wiring
        run: |
          grep -q "getGame, hasGame, listGames" server.js
          grep -q "data-game=\"othello\"" public/index.html
          grep -q "drawOthelloBoard" public/app.js
          grep -q "version: '1.6.0'" server.js
      - name: Remove one-shot migration files
        run: rm -f .github/workflows/apply-multigame-v160.yml scripts/apply-multigame-v160.py
      - name: Commit applied upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add shared game architecture and Othello [v160-applied]"
          git push
