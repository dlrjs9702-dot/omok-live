name: Apply room social v1.5.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply upgrade
        run: node scripts/apply-social-v150.js
      - name: Validate syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check lib/room-social.js
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run tests
        run: npm test
      - name: Remove one-shot migration files
        run: rm -f .github/workflows/apply-social-v150.yml scripts/apply-social-v150.js
      - name: Commit applied upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add nickname presence and ephemeral room chat [v150-applied]"
          git push
