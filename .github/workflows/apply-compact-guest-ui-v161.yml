name: Apply compact guest UI v1.6.1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply upgrade
        run: python3 scripts/apply-compact-guest-ui-v161.py
      - name: Validate syntax
        run: |
          node --check server.js
          node --check public/app.js
          node --check lib/security.js
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run tests
        run: npm test
      - name: Verify compact guest UI
        run: |
          grep -q "자세히 보기" public/app.js
          grep -q "게임센터 -" lib/security.js
          grep -q "compactKeyRow" public/styles.css
      - name: Remove one-shot migration files
        run: rm -f .github/workflows/apply-compact-guest-ui-v161.yml scripts/apply-compact-guest-ui-v161.py
      - name: Commit applied upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Compact guest access rows and rename guest files [v161-applied]"
          git push
