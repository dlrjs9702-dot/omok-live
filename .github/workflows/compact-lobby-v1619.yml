name: Verify compact lobby and eight-game results v1.6.19
on:
  push:
    branches: [compact-lobby-rules-effects-v1619-20260917]
permissions:
  contents: write
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded changes to precise production base
        shell: bash
        run: |
          set -euo pipefail
          cp .release/compact-lobby-v1619.py /tmp/compact-lobby-v1619.py
          git fetch origin main
          git switch --detach origin/main
          test "$(git rev-parse HEAD)" = 'b0bebfec020104708dd1b2bc0ac4ea43ce167891'
          python3 /tmp/compact-lobby-v1619.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/lobby-compact-effects.test.js')
          s=p.read_text(encoding='utf-8')
          if s.startswith('\\n'):
              s=s[2:]
              p.write_text(s, encoding='utf-8')
          assert s.startswith("'use strict';"), repr(s[:20])
          p=Path('test/connect4.test.js')
          s=p.read_text(encoding='utf-8')
          old='assert.match(html, /7열×6행/);'
          new='assert.match(js, /7열×6행/);'
          assert s.count(old)==1, ('Stale Connect Four rule assertion',s.count(old))
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check server.js
          node --check public/app.js
          node --check lib/release-announcements.js
          node --check test/lobby-compact-effects.test.js
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete regression suite
        run: npm test
      - name: Check persisted keys, eight games and notice integrity
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const names = require('./lib/games').listGames();
          const notices = require('./lib/release-announcements');
          if (pkg.version !== '1.6.19' || lock.version !== '1.6.19') throw Error('Wrong version');
          if (names.length !== 8 || names.find(g => g.id === 'cityking')?.name !== '랜드킹') throw Error('Existing game compatibility');
          if (notices.filter(n => n.key === 'v1.6.19').length !== 1) throw Error('Release notice missing or duplicate');
          const html = fs.readFileSync('public/index.html', 'utf8');
          if ((html.match(/data-game-option=/g) || []).length !== 8) throw Error('Missing game');
          if ((html.match(/class="gameRuleDetails"/g) || []).length) throw Error('Duplicate rule expanders');
          for (const path of ['server.js', 'public/app.js']) {
            const source = fs.readFileSync(path, 'utf8');
            for (const keyword of ['/api/admin/keys', '/reissue', '/rename']) if (path === 'server.js' && !source.includes(keyword)) throw Error('Admin access lost: ' + keyword);
          }
          require('pg');
          console.log('Eight original games, single rules selector, key routes, release notice, Postgres driver and version verified');
          JS
      - name: Push verified commit to staging branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/app.js public/styles.css server.js package.json package-lock.json lib/release-announcements.js test
          git diff --cached --check
          git commit -m 'Compact lobby and verify outcome for eight games [v1.6.19]'
          git push origin HEAD:refs/heads/verified-compact-lobby-v1619-20260917
          echo "Verified commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
