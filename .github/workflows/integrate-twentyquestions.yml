name: Integrate and verify Twenty Questions

on:
  push:
    branches:
      - feature/twenty-questions-20260923
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twentyquestions-integration
  cancel-in-progress: false

jobs:
  integrate-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/twenty-questions-20260923
          fetch-depth: 0

      - name: Correct guarded lockfile anchors and cache version assertions
        run: node .release/fix-twenty-integration.cjs

      - name: Apply guarded integration to targeted files
        run: node .release/integrate-twentyquestions.cjs

      - name: Check syntax and patch whitespace
        run: |
          node --check .release/integrate-twentyquestions.cjs
          node --check server.js
          node --check public/app.js
          node --check public/twentyquestions-ui.js
          node --check lib/games/index.js
          node --check lib/games/twentyquestions.js
          node --check lib/games/twentyquestions-adapter.js
          node --check lib/match-result.js
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test game integration and all existing games
        run: |
          if npm test > /tmp/twenty-test-results.log 2>&1; then
            tail -n 15 /tmp/twenty-test-results.log
          else
            awk '/^not ok / { n=10 } n>0 { print substr($0,1,190); n-- }' /tmp/twenty-test-results.log | head -n 130 || true
            grep -E '^# tests |^# pass |^# fail |^# cancelled |^# skipped ' /tmp/twenty-test-results.log || true
            exit 1
          fi

      - name: Verify UI wiring and private-answer boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const { getGame, listGames } = require('./lib/games');
          const game = getGame('twentyquestions');
          assert(game && listGames().length === 14);
          const server = fs.readFileSync('server.js', 'utf8');
          const html = fs.readFileSync('public/index.html', 'utf8');
          const js = fs.readFileSync('public/app.js', 'utf8');
          assert(server.includes("myTwentySecret: isTwenty(room) ? getGame('twentyquestions').secretFor(room.game, seat) : null"));
          assert(server.includes('twenty-judge|'));
          assert(html.includes('id="twentyActionPanel"') && html.includes('id="twentyPanel"'));
          assert(html.includes('/twentyquestions-ui.js?v=1.6.69'));
          assert(js.includes('window.TwentyQuestionsUI.init(roomAction)'));
          assert(js.includes('window.TwentyQuestionsUI.render(state)'));
          assert.equal(require('./package.json').version, '1.6.69');
          console.log('Twenty Questions registry, UI actions and private-answer path verified');
          NODE

      - name: Publish only verified integration to feature branch
        run: |
          git config user.name "game-center-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .release/integrate-twentyquestions.cjs server.js public/index.html public/app.js public/styles.css package.json package-lock.json lib/games/index.js lib/match-result.js
          git add -u test
          if git diff --cached --quiet; then
            echo 'Already integrated; no commit needed'
          else
            git commit -m "Integrate Twenty Questions game center [v1.6.69]"
            git push origin HEAD:refs/heads/feature/twenty-questions-20260923
          fi
